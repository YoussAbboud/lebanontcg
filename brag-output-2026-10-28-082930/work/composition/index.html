<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"color-ground","type":"color","label":"Background","default":"#08090b"},
    {"id":"color-ink","type":"color","label":"Text","default":"#f2f5f7"},
    {"id":"color-accent","type":"color","label":"Accent","default":"#d6ff3f"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>LebanonTCG chat brag</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #08090b; }
      #root { position: relative; width: 100%; height: 100%; background: #08090b; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="21" data-width="1920" data-height="1080">
      <!-- Scenes. 120 BPM: every seam is on a beat (0.5 s), every scene on a bar line or half bar. -->
      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html"
        data-start="0" data-duration="4" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080"></div>
      <div id="offer" data-composition-id="offer" data-composition-src="compositions/offer.html"
        data-start="4" data-duration="5" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080"></div>
      <div id="phone" data-composition-id="phone" data-composition-src="compositions/phone.html"
        data-start="9" data-duration="4" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080"></div>
      <div id="meet" data-composition-id="meet" data-composition-src="compositions/meet.html"
        data-start="13" data-duration="5" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080"></div>
      <div id="outro" data-composition-id="outro" data-composition-src="compositions/outro.html"
        data-start="18" data-duration="3" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080"></div>

      <!-- One piece: music and effects synthesized together on the 120 BPM grid (work/synth.py). -->
      <audio id="soundtrack" class="clip" data-start="0" data-duration="21" data-track-index="2"
        data-volume="1" src="assets/audio/soundtrack.wav"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
