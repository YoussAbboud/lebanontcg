<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>LebanonTCG — You're offline</title>
    <meta name="theme-color" content="#08090b" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      html, body { margin: 0; min-height: 100%; background: #08090b; color: #f2f5f7; font-family: Inter, system-ui, -apple-system, sans-serif; }
      main { max-width: 420px; margin: 18vh auto 0; padding: 32px 24px; text-align: center; }
      img { width: 72px; height: 72px; border-radius: 17px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); }
      h1 { margin: 22px 0 8px; font-size: 22px; letter-spacing: -0.02em; }
      p { margin: 0; color: #b9c2cc; font-size: 15px; line-height: 1.5; }
      button { margin-top: 24px; min-height: 44px; padding: 0 22px; border: 0; border-radius: 999px; background: #d6ff3f; color: #08090b; font: 600 15px Inter, system-ui, sans-serif; }
      .mono { margin-top: 28px; font: 500 11px 'JetBrains Mono', ui-monospace, monospace; letter-spacing: 0.12em; text-transform: uppercase; color: #7b8590; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="" width="72" height="72" />
      <h1>You're offline</h1>
      <p>LebanonTCG needs a connection to show listings and chats. Check your Wi-Fi or data and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
      <div class="mono">We connect collectors. You handle the deal.</div>
    </main>
  </body>
</html>
